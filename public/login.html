<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Incident Logger</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <main class="auth">
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
      <div class="form__group">
        <label class="form__label" for="email">Email</label>
        <input class="form__input" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="form__group">
        <label class="form__label" for="password">Password</label>
        <input class="form__input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form__error" data-error hidden></div>
      <button class="btn btn--primary btn--block" type="submit">Sign in</button>
    </form>

    <div class="auth__separator is-hidden" id="google-divider">or</div>

    <a class="btn btn--secondary btn--block is-hidden" id="google-signin" href="/api/auth/google">Continue with Google</a>

    <p class="auth__footer is-hidden" data-registration-gated>
      No account? <a href="/register.html">Create one</a>
    </p>
  </main>

  <script type="module" src="/js/page-login.js"></script>
</body>
</html>
