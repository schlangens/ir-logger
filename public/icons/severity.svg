<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-low" viewBox="0 0 24 24" fill="currentColor">
    <circle cx="12" cy="12" r="8" />
  </symbol>
  <symbol id="icon-medium" viewBox="0 0 24 24" fill="currentColor">
    <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.5" />
    <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2.5" />
  </symbol>
  <symbol id="icon-high" viewBox="0 0 24 24" fill="currentColor">
    <polygon points="12,4 20,18 4,18" />
  </symbol>
  <symbol id="icon-critical" viewBox="0 0 24 24" fill="currentColor">
    <polygon points="12,3 21,12 12,21 3,12" />
